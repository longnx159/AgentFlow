<script type="text/javascript">
  (function () {
    const STORAGE_KEY = 'af_lang';
    const UI_TEXT = {
      vi: {
        nameLabel: 'Tên',
        outputPlaceholder: 'Trống = Task gần nhất',
        deployNote: 'Deploy chỉ lưu bản nháp. Publish trong Manager để kích hoạt phiên bản.',
        casesCount: '{count} cases + Otherwise',
        invalidJson: 'JSON không hợp lệ',
        casesMustBeArray: 'Cases phải là mảng JSON',
        ruleBoxTitle: 'Tạo rule cho case 1',
        ruleBoxDesc: 'Chọn AND / OR, thêm điều kiện, rồi áp dụng. Các case khác được giữ nguyên.',
        joinAnd: 'AND · tất cả điều kiện',
        joinOr: 'OR · ít nhất một điều kiện',
        addCondition: '＋ Điều kiện',
        applyCase1: 'Áp dụng vào case 1',
        ruleBoxHint:
          'Giá trị true/false/số được giữ đúng kiểu. Văn bản không cần dấu ngoặc kép. Bạn vẫn có thể sửa JSON nâng cao bên dưới.',
        valuePlaceholder: '80 / true / văn bản',
        removeCondition: 'Xóa điều kiện',
        case1Updated: 'Đã cập nhật case 1.',
      },
      en: {
        nameLabel: 'Name',
        outputPlaceholder: 'Empty = Latest Task',
        deployNote: 'Deploy saves a draft only. Publish in Manager to activate a version.',
        casesCount: '{count} cases + Otherwise',
        invalidJson: 'Invalid JSON',
        casesMustBeArray: 'Cases must be a JSON array',
        ruleBoxTitle: 'Build rule for case 1',
        ruleBoxDesc: 'Choose AND / OR, add conditions, then apply. Other cases are preserved.',
        joinAnd: 'AND · all conditions',
        joinOr: 'OR · at least one condition',
        addCondition: '＋ Condition',
        applyCase1: 'Apply to case 1',
        ruleBoxHint:
          'true/false/number values keep their types. Plain text does not need quotes. You can still edit advanced JSON below.',
        valuePlaceholder: '80 / true / text',
        removeCondition: 'Remove condition',
        case1Updated: 'Updated case 1.',
      },
    };
    function getLang() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved === 'en' || saved === 'vi' ? saved : 'vi';
      } catch {
        return 'vi';
      }
    }
    function setLang(lang) {
      try {
        localStorage.setItem(STORAGE_KEY, lang);
      } catch {}
    }
    function tr(lang, key, params = {}) {
      let text = (UI_TEXT[lang] || UI_TEXT.vi)[key] || key;
      for (const [k, v] of Object.entries(params)) {
        text = text.replaceAll(`{${k}}`, String(v ?? ''));
      }
      return text;
    }

    const definitions = {
      start: {
        color: '#8dc8b1',
        icon: 'font-awesome/fa-play',
        inputs: 0,
        fields: { triggers: '[{"id":"manual","type":"manual"}]', execution: '{}', limits: '{}' },
      },
      task: {
        color: '#a9c6e6',
        icon: 'font-awesome/fa-pencil',
        fields: { skill: '', role: 'writer', input: '{{input}}', timeout: '{}' },
      },
      review: {
        color: '#c5b6e3',
        icon: 'font-awesome/fa-check-square-o',
        fields: { skill: '', rubric: '', role: 'reviewer', input: '{{lastOutput}}', timeout: '{}' },
      },
      condition: {
        color: '#ead3a2',
        icon: 'font-awesome/fa-code-fork',
        fields: { cases: '[{"==":[{"var":"input.approved"},true]}]', timeout: '{}' },
      },
      repeat: {
        color: '#e5b89f',
        icon: 'font-awesome/fa-repeat',
        fields: { target: '', maxIterations: 3, delaySec: 0, timeout: '{}' },
      },
      delay: {
        color: '#b9cbd0',
        icon: 'font-awesome/fa-clock-o',
        fields: { delaySec: 60, until: '', timeout: '{}' },
      },
      end: {
        color: '#a6c9b0',
        icon: 'font-awesome/fa-stop',
        outputs: 0,
        fields: { outcome: 'succeeded', outputNodeId: '' },
      },
    };
    Object.keys(definitions).forEach((kind) => {
      const d = definitions[kind],
        defaults = { name: { value: '' } };
      Object.keys(d.fields).forEach((key) => (defaults[key] = { value: d.fields[key] }));
      if (kind === 'condition') defaults.outputs = { value: 2 };
      RED.nodes.registerType('af-' + kind, {
        category: 'Agent Flow',
        color: d.color,
        defaults,
        inputs: d.inputs === 0 ? 0 : 1,
        outputs: d.outputs === 0 ? 0 : kind === 'condition' ? 2 : 1,
        icon: d.icon,
        label: function () {
          return this.name || 'AF ' + kind;
        },
        outputLabels: function (i) {
          return kind === 'condition'
            ? i < this.outputs - 1
              ? 'Case ' + (i + 1)
              : 'Otherwise'
            : 'Next';
        },
        oneditprepare: function () {
          let lang = getLang();
          const langBar = $(
            '<div class="form-row af-lang-bar" style="display:flex;justify-content:flex-end;gap:4px;margin-bottom:8px"><button type="button" class="red-ui-button af-lang-btn" data-lang="vi">VI</button><button type="button" class="red-ui-button af-lang-btn" data-lang="en">EN</button></div>',
          );
          $('#dialog-form').prepend(langBar);

          const applyNodeLang = () => {
            langBar.find('.af-lang-btn').each(function () {
              const active = $(this).data('lang') === lang;
              $(this).css({
                fontWeight: active ? '700' : '400',
                borderColor: active ? '#2b6b54' : '',
                color: active ? '#2b6b54' : '',
              });
            });
            $('label[for="node-input-name"]').text(tr(lang, 'nameLabel'));
            $('#node-input-outputNodeId').attr('placeholder', tr(lang, 'outputPlaceholder'));
            $('.af-deploy-note').text(tr(lang, 'deployNote'));
            if (kind === 'condition') {
              $('#node-input-cases').trigger('input');
              const box = $('.af-rule-box');
              box.find('.af-rule-title').text(tr(lang, 'ruleBoxTitle'));
              box.find('.af-rule-desc').text(tr(lang, 'ruleBoxDesc'));
              box.find('.af-join option[value="and"]').text(tr(lang, 'joinAnd'));
              box.find('.af-join option[value="or"]').text(tr(lang, 'joinOr'));
              box.find('.af-add').text(tr(lang, 'addCondition'));
              box.find('.af-apply').text(tr(lang, 'applyCase1'));
              box.find('.af-rule-hint').text(tr(lang, 'ruleBoxHint'));
              box.find('.af-value').attr('placeholder', tr(lang, 'valuePlaceholder'));
              box.find('.af-remove').attr('title', tr(lang, 'removeCondition'));
            }
          };

          langBar.on('click', '.af-lang-btn', function () {
            lang = $(this).data('lang');
            setLang(lang);
            applyNodeLang();
          });

          if (kind === 'condition') {
            $('#node-input-cases')
              .on('input', function () {
                try {
                  $('#af-case-status').text(
                    tr(lang, 'casesCount', { count: JSON.parse(this.value).length }),
                  );
                } catch {
                  $('#af-case-status').text(tr(lang, 'invalidJson'));
                }
              })
              .trigger('input');
            const box = $(
              `<div class="form-row af-rule-box" style="padding:12px;background:#f3f6ef;border-radius:7px"><b class="af-rule-title"></b><p class="af-rule-desc"></p><select class="af-join" style="width:100%"><option value="and"></option><option value="or"></option></select><div class="af-rows"></div><button type="button" class="red-ui-button af-add"></button> <button type="button" class="red-ui-button af-apply"></button><p class="af-rule-error" style="color:#b55d42"></p><small class="af-rule-hint"></small></div>`,
            );
            $('#node-input-cases').closest('.form-row').before(box);
            function addRule(initial) {
              const row = $(
                `<div class="af-rule-row" style="display:flex;gap:5px;margin:10px 0"><input class="af-field" style="width:38%" placeholder="review.score"><select class="af-operator" style="width:22%"></select><input class="af-value" style="width:30%" placeholder="${tr(lang, 'valuePlaceholder')}"><button type="button" class="red-ui-button af-remove" title="${tr(lang, 'removeCondition')}">×</button></div>`,
              );
              ['==', '!=', '>', '>=', '<', '<=', 'contains', 'exists'].forEach((op) =>
                row.find('.af-operator').append($('<option>').val(op).text(op)),
              );
              row.find('.af-field').val(initial?.field || '');
              row.find('.af-operator').val(initial?.operator || '==');
              row.find('.af-value').val(initial?.value ?? '');
              row.find('.af-remove').on('click', () => row.remove());
              box.find('.af-rows').append(row);
            }
            let restored = false;
            try {
              const current = JSON.parse($('#node-input-cases').val())[0],
                logic = current?.when || current;
              const op = logic && Object.keys(logic)[0];
              if (['and', 'or'].includes(op) && Array.isArray(logic[op])) {
                const rows = logic[op].map((clause) => {
                  const operator = Object.keys(clause)[0],
                    arg = clause[operator];
                  if (operator === 'exists') return { field: arg, operator, value: '' };
                  if (!Array.isArray(arg) || typeof arg[0]?.var !== 'string')
                    throw Error('advanced');
                  return { field: arg[0].var, operator, value: JSON.stringify(arg[1]) };
                });
                box.find('.af-join').val(op);
                rows.forEach(addRule);
                restored = rows.length > 0;
              }
            } catch {}
            if (!restored) addRule({ field: 'review.passed', operator: '==', value: 'true' });
            box.find('.af-add').on('click', () => addRule());
            box.find('.af-apply').on('click', async () => {
              try {
                const { buildRule } = await import('/rules.js');
                const rows = [];
                box.find('.af-rule-row').each(function () {
                  rows.push({
                    field: $(this).find('.af-field').val(),
                    operator: $(this).find('.af-operator').val(),
                    value: $(this).find('.af-value').val(),
                  });
                });
                const rule = buildRule(rows, box.find('.af-join').val());
                const cases = JSON.parse($('#node-input-cases').val() || '[]');
                if (!Array.isArray(cases)) throw Error(tr(lang, 'casesMustBeArray'));
                cases[0] = cases[0]?.when ? { ...cases[0], when: rule } : rule;
                $('#node-input-cases')
                  .val(JSON.stringify(cases, null, 2))
                  .trigger('input');
                box.find('.af-rule-error').text(tr(lang, 'case1Updated'));
              } catch (error) {
                box.find('.af-rule-error').text(error.message);
              }
            });
          }
          applyNodeLang();
        },
        oneditsave: function () {
          if (kind === 'condition') {
            try {
              this.outputs = JSON.parse($('#node-input-cases').val()).length + 1;
            } catch {
              this.outputs = 2;
            }
          }
        },
      });
    });
  })();
</script>
<script type="text/html" data-template-name="af-start">

      style="width:100%;font-family:monospace"

    <label for="node-input-execution">execution</label

      id="node-input-execution"
      rows="5"
      style="width:100%;font-family:monospace"

  </div>
  <div class="form-row">
    <label for="node-input-limits">limits</label
    ><textarea id="node-input-limits" rows="5" style="width:100%;font-family:monospace"></textarea>
  </div>
  <div id="af-case-status"></div>
  <p class="af-deploy-note" style="color:#666">
    Deploy chỉ lưu bản nháp. Publish trong Manager để kích hoạt phiên bản.
  </p>
</script>
<script type="text/html" data-help-name="af-start">
  <p>
    Node thụ động: chỉ Manager thực thi sau Publish. / Passive node: executed only by Manager after
    Publish.
  </p>
  <p>
    skill: nội dung hướng dẫn / instruction prompt; input: template {{input}}, {{lastOutput}},
    {{feedback}}, {{previousOutput}}, {{steps.NODE.text}}. timeout/execution: JSON cấu hình thời
    gian / timeout config (null = unlimited).
  </p>
  <p>
    Condition cases: mảng JSON Logic / JSON Logic array (and/or, var). Mỗi case tương ứng một cổng;
    cổng cuối Otherwise. Repeat target: id node cần lặp / node id to repeat; maxIterations tính cả
    lượt đầu / includes first pass. End outputNodeId: Task/Review node ID (trống = Task gần nhất /
    empty = latest Task).
  </p>
  <p>
    Start triggers: [{"id":"manual","type":"manual"}]. Schedule: cron/intervalSec + timezone; event:
    eventType; workflow: sourceWorkflowId. Supports when JSON Logic, overlap queue/skip, missed
    skip/catchUpLatest.
  </p>
</script>
